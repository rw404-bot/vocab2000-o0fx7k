<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最常用 2000 英文單字學習</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--pri:#3b6cf6;--ok:#22a55b;--bad:#e5484d;--tx:#1d2433;--mu:#6b7488;--bd:#e3e7f0}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
header h1{font-size:19px;margin:0;flex:1}
header .st{font-size:14px;opacity:.95}
nav{display:flex;gap:4px;padding:10px 20px 0;max-width:900px;margin:auto;flex-wrap:wrap}
nav button{border:0;background:#dfe5f5;padding:9px 16px;border-radius:10px 10px 0 0;font-size:15px;cursor:pointer;color:var(--tx)}
nav button.on{background:var(--card);color:var(--pri);font-weight:700}
main{max-width:900px;margin:auto;background:var(--card);padding:20px;border-radius:0 12px 12px 12px;min-height:60vh;margin-bottom:30px}
.bar{height:10px;background:#e6eaf5;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
button.b{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-size:15px;cursor:pointer}
button.b.g{background:#e8ecf6;color:var(--tx)}button.b.ok{background:var(--ok)}
button.b:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.w{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}
.w.done{background:#f1fbf5;border-color:#bfe8cf}
.w .sp{font-size:22px;background:#eef2ff;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer;flex:none}
.w .sp:hover{background:#dbe4ff}
.w .en{font-size:21px;font-weight:700;cursor:pointer}
.w .ipa{color:var(--pri);font-family:"Segoe UI",Arial,sans-serif;margin-left:8px;font-size:15px}
.w .zh{color:var(--tx);font-size:16px}
.w .mt{color:var(--mu);font-size:13px}
.w .inf{flex:1}
.tag{font-size:11px;background:#eef2ff;color:var(--pri);padding:1px 7px;border-radius:9px;margin-left:6px}
.q{font-size:30px;font-weight:700;text-align:center;margin:20px 0 6px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border:2px solid var(--bd);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.opt:hover{border-color:var(--pri)}.opt.right{border-color:var(--ok);background:#e9f9ef}.opt.wrong{border-color:var(--bad);background:#fdecec}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:10px}
.day{padding:8px 0;text-align:center;border-radius:8px;background:#eef1f8;cursor:pointer;font-size:13px}
.day.d{background:#bfe8cf}.day.p{background:#ffe9b3}.day.cur{outline:2px solid var(--pri)}
input[type=number],input[type=search],select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:15px}
input[type=search]{width:100%}
.mu{color:var(--mu);font-size:14px}.c{text-align:center}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
</style>
</head>

const KEY='vocab2000_v1';
let S = JSON.parse(localStorage.getItem(KEY)||'null') || {perDay:20,day:1,known:{},wrong:{},daysDone:{},quizBest:{},streak:0,last:'',rate:0.9,voice:''};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=s=>document.querySelector(s);
const totalDays=()=>Math.ceil(WORDS.length/S.perDay);
const dayWords=d=>WORDS.slice((d-1)*S.perDay,d*S.perDay);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='learn';

/* ---- 發音 ---- */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'))}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音,請改用 Chrome 或 Edge');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=S.rate;
  const v=voices.find(v=>v.name===S.voice)||voices.find(v=>v.lang==='en-US')||voices[0];
  if(v)u.voice=v;speechSynthesis.speak(u);
}
window.speakIdx=i=>speak(WORDS[i].w);

/* ---- 共用 ---- */
function today(){return new Date().toISOString().slice(0,10)}
function markStudy(){
  const t=today();if(S.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.last===y)?S.streak+1:1;S.last=t;save();
}
function header(){
  const k=Object.values(S.known).filter(Boolean).length;
  $('#hdr').textContent=`已學會 ${k} / ${WORDS.length} 字 ・ 連續學習 ${S.streak} 天`;
}
function nav(){
  const T=[['learn','📖 今日學習'],['quiz','📝 小測驗'],['review','🔁 複習錯題'],['over','📊 進度/設定'],['all','🔎 單字總表']];
  $('#nav').innerHTML=T.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
}
window.go=t=>{tab=t;render()};
function render(){header();nav();({learn,quiz:quizHome,review,over,all})[tab]()}

/* ---- 今日學習 ---- */
function wordRow(w){
  const i=w.r-1,kn=S.known[w.w];
  return `<div class="w ${kn?'done':''}">
    <button class="sp" onclick="speakIdx(${i})" title="點擊發音">🔊</button>
    <div class="inf"><span class="en" onclick="speakIdx(${i})">${esc(w.w)}</span><span class="ipa">${esc(w.i)}</span><span class="tag">${w.c||''}</span>
    <div class="zh">${esc(w.z)}</div><div class="mt">#${w.r} ・ ${esc(w.p)}</div></div>
    <label class="mu"><input type="checkbox" ${kn?'checked':''} onchange="toggleKnown('${w.w}',this.checked)"> 學會了</label></div>`;
}
window.toggleKnown=(w,v)=>{S.known[w]=v;markStudy();save();learn()};
function learn(){
  const d=S.day,ws=dayWords(d),n=ws.filter(w=>S.known[w.w]).length;
  $('#main').innerHTML=`
  <div class="row"><button class="b g" onclick="chDay(-1)" ${d<=1?'disabled':''}>◀ 上一天</button>
   <b style="font-size:20px">第 ${d} / ${totalDays()} 天</b>
   <button class="b g" onclick="chDay(1)" ${d>=totalDays()?'disabled':''}>下一天 ▶</button>
   <span class="mu">今日目標:學會 ${ws.length} 字(#${ws[0].r}–#${ws[ws.length-1].r})</span></div>
  <div class="bar"><i style="width:${n/ws.length*100}%"></i></div>
  <div class="row mu">進度 ${n}/${ws.length}
    <button class="b g" onclick="playAll()">▶ 依序播放全部</button>
    <button class="b g" onclick="markAll(true)">全部標為學會</button>
    <button class="b ok" onclick="go('quiz')">去做今日小測驗 →</button></div>
  <p class="mu">提示:點 🔊 或單字即可聽發音;先聽、跟著念三次、再勾選「學會了」。</p>
  ${ws.map(wordRow).join('')}`;
}
window.chDay=n=>{S.day=Math.min(totalDays(),Math.max(1,S.day+n));save();render()};
window.markAll=v=>{dayWords(S.day).forEach(w=>S.known[w.w]=v);markStudy();save();render()};
let playing=false;
window.playAll=async()=>{
  if(playing){playing=false;return}playing=true;
  for(const w of dayWords(S.day)){if(!playing)break;speak(w.w);await new Promise(r=>setTimeout(r,1600/S.rate))}
  playing=false;
};

/* ---- 小測驗 ---- */
let Q=null;
function quizHome(){
  Q=null;
  const d=S.day;
  $('#main').innerHTML=`<h3>第 ${d} 天 小測驗</h3>
  <p class="mu">每題 4 選 1,答完會顯示分數並自動記錄錯題。80 分以上算通過。</p>
  <div class="row"><button class="b" onclick="startQuiz('zh',${d})">① 看英文 → 選中文</button>
  <button class="b" onclick="startQuiz('en',${d})">② 看中文 → 選英文</button>
  <button class="b" onclick="startQuiz('ear',${d})">③ 🎧 聽發音 → 選單字</button></div>
  <h3>累積複習</h3>
  <div class="row"><button class="b g" onclick="startQuiz('zh',0)">複習:第 1–${d} 天隨機 20 題</button></div>
  <p class="mu">最佳成績:${S.quizBest[d]!=null?S.quizBest[d]+' 分':'尚未測驗'}</p>`;
}
window.startQuiz=(mode,d,customList)=>{
  tab='quiz';nav();
  let pool=customList|| (d?dayWords(d):WORDS.slice(0,S.day*S.perDay));
  pool=[...pool].sort(()=>Math.random()-.5);
  if(!d&&!customList||(customList&&pool.length>20))pool=pool.slice(0,20);
  Q={mode,d,items:pool,i:0,score:0,wrong:[]};nextQ();
};
function distract(w,n=3){
  const near=WORDS.slice(Math.max(0,w.r-1-150),w.r-1+150).filter(x=>x.w!==w.w&&x.s!==w.s);
  const same=near.filter(x=>x.p===w.p);
  const src=(same.length>=n?same:near).sort(()=>Math.random()-.5);
  return src.slice(0,n);
}
function nextQ(){
  if(Q.i>=Q.items.length)return finish();
  const w=Q.items[Q.i],opts=[w,...distract(w)].sort(()=>Math.random()-.5);
  const m=Q.mode;
  const head=m==='zh'?`<div class="q">${esc(w.w)} <button class="b g" onclick="speakIdx(${w.r-1})">🔊</button></div><div class="c mu">${esc(w.i)} ・ 選出正確的中文</div>`
    :m==='en'?`<div class="q">${esc(w.s)}</div><div class="c mu">${esc(w.p)} ・ 選出正確的英文</div>`
    :`<div class="q"><button class="b" style="font-size:26px;padding:14px 26px" onclick="speakIdx(${w.r-1})">🎧 再聽一次</button></div><div class="c mu">聽發音,選出你聽到的單字</div>`;
  $('#main').innerHTML=`<div class="row mu">第 ${Q.i+1} / ${Q.items.length} 題 ・ 得分 ${Q.score}</div>
   <div class="bar"><i style="width:${Q.i/Q.items.length*100}%"></i></div>${head}
   <div id="opts">${opts.map(o=>`<button class="opt" data-w="${esc(o.w)}" onclick="answer(this,'${w.w}')">${m==='zh'?esc(o.s):esc(o.w)}</button>`).join('')}</div><div id="fb"></div>`;
  if(m==='ear')setTimeout(()=>speak(w.w),300);
}
window.answer=(el,ans)=>{
  const w=Q.items[Q.i],ok=el.dataset.w===ans;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.w===ans)b.classList.add('right')});
  if(ok){Q.score++;if(S.wrong[w.w])S.wrong[w.w]=Math.max(0,S.wrong[w.w]-1)}
  else{el.classList.add('wrong');Q.wrong.push(w);S.wrong[w.w]=(S.wrong[w.w]||0)+2}
  speak(w.w);
  $('#fb').innerHTML=`<p class="c"><b>${esc(w.w)}</b> ${esc(w.i)} ${esc(w.z)}</p><div class="c"><button class="b" onclick="Q.i++;nextQ()">${Q.i+1>=Q.items.length?'看結果':'下一題 →'}</button></div>`;
  save();
};
function finish(){
  const pct=Math.round(Q.score/Q.items.length*100),pass=pct>=80;
  if(Q.d&&(S.quizBest[Q.d]==null||pct>S.quizBest[Q.d]))S.quizBest[Q.d]=pct;
  if(Q.d&&pass)S.daysDone[Q.d]=1;
  markStudy();save();header();
  $('#main').innerHTML=`<div class="c"><div class="q">${pct} 分 ${pass?'🎉 通過!':'💪 再接再厲'}</div>
  <p class="mu">答對 ${Q.score} / ${Q.items.length}</p>
  <div class="row" style="justify-content:center"><button class="b" onclick="startQuiz('${Q.mode}',${Q.d||0})">再測一次</button>
  ${pass&&Q.d&&Q.d<totalDays()?`<button class="b ok" onclick="S.day=${Q.d+1};save();go('learn')">開始第 ${Q.d+1} 天 →</button>`:''}
  <button class="b g" onclick="go('learn')">回學習頁</button></div></div>
  ${Q.wrong.length?'<h3>答錯的單字(已加入錯題本)</h3>'+Q.wrong.map(wordRow).join(''):''}`;
}

/* ---- 複習錯題 ---- */
function review(){
  const ws=WORDS.filter(w=>S.wrong[w.w]>0);
  $('#main').innerHTML=`<h3>錯題本(${ws.length} 字)</h3>`+(ws.length?
   `<div class="row"><button class="b" onclick="startQuiz('zh',0,WORDS.filter(w=>S.wrong[w.w]>0))">用錯題做測驗</button>
    <button class="b g" onclick="if(confirm('清空錯題本?')){S.wrong={};save();review()}">清空</button></div>`+ws.map(wordRow).join('')
   :'<p class="mu">目前沒有錯題,太棒了!</p>');
}

/* ---- 進度/設定 ---- */
function over(){
  const td=totalDays(),k=Object.values(S.known).filter(Boolean).length;
  let cells='';
  for(let d=1;d<=td;d++){
    const ws=dayWords(d),n=ws.filter(w=>S.known[w.w]).length;
    cells+=`<div class="day ${S.daysDone[d]?'d':n?'p':''} ${d===S.day?'cur':''}" onclick="S.day=${d};save();go('learn')" title="${n}/${ws.length}">${d}</div>`;
  }
  const voiceOpts=voices.map(v=>`<option ${v.name===S.voice?'selected':''}>${esc(v.name)}</option>`).join('');
  $('#main').innerHTML=`<h3>總進度</h3><div class="bar"><i style="width:${k/WORDS.length*100}%"></i></div>
  <p>已學會 <b>${k}</b> / ${WORDS.length} 字(${(k/WORDS.length*100).toFixed(1)}%) ・ 通過測驗 ${Object.keys(S.daysDone).length} / ${td} 天</p>
  <div class="mu">🟩 測驗通過 　🟨 學習中 　⬜ 未開始(點日期可跳過去)</div><div class="days">${cells}</div>
  <h3>每日目標設定</h3>
  <div class="row">每天學 <input type="number" id="pd" min="5" max="100" step="5" value="${S.perDay}" style="width:80px"> 個字
   <button class="b" onclick="setPer()">套用</button>
   <span class="mu" id="eta"></span></div>
  <h3>發音設定</h3>
  <div class="row">語音 <select id="vs" onchange="S.voice=this.value;save()"><option value="">自動(美式英文)</option>${voiceOpts}</select>
   速度 <input type="range" min="0.5" max="1.2" step="0.1" value="${S.rate}" onchange="S.rate=+this.value;save()">
   <button class="b g" onclick="speak('Hello, nice to meet you')">試聽</button></div>
  <h3>資料</h3><div class="row"><button class="b g" onclick="if(confirm('確定清除所有進度?')){localStorage.removeItem(KEY);location.reload()}">重設全部進度</button></div>
  <p class="mu">進度存在這台電腦的瀏覽器中(localStorage),換瀏覽器或清除瀏覽資料會消失。</p>`;
  const upd=()=>{const v=+$('#pd').value||20;$('#eta').textContent=`→ 共 ${Math.ceil(WORDS.length/v)} 天(約 ${(Math.ceil(WORDS.length/v)/30).toFixed(1)} 個月)完成`};
  $('#pd').oninput=upd;upd();
}
window.setPer=()=>{
  const v=Math.min(100,Math.max(5,+$('#pd').value||20));
  const first=(S.day-1)*S.perDay;S.perDay=v;S.day=Math.floor(first/v)+1;S.daysDone={};S.quizBest={};
  save();render();
};

/* ---- 單字總表 ---- */
function all(){
  $('#main').innerHTML=`<input type="search" id="q" placeholder="搜尋英文或中文…"><div id="res"></div>`;
  const f=()=>{
    const q=$('#q').value.trim().toLowerCase();
    const r=WORDS.filter(w=>!q||w.w.includes(q)||w.z.includes(q)).slice(0,100);
    $('#res').innerHTML=`<p class="mu">顯示 ${r.length} 筆${r.length===100?'(僅前 100 筆,請縮小搜尋)':''}</p>`+r.map(wordRow).join('');
  };
  $('#q').oninput=f;f();
}

render();
</script>
</body>
</html>
